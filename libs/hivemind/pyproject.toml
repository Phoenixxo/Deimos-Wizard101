[project]
name = "hivemind"
version = "0.1.0"
description = "Bot-to-bot communication protocol over Wizard101 directed chat"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
readme = "README.md"
dependencies = [
    "wizwalker",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hivemind"]

# The steg cipher's reference corpus must travel with the package.
[tool.hatch.build.targets.wheel.force-include]
"hivemind/data/chatlog_p1.txt" = "hivemind/data/chatlog_p1.txt"
