[workspace]
members = [
    "crates/deimos-core",
    "crates/deimos-agent",
    "crates/deimos-memory-fixture",
    "crates/deimos-native",
]
# These are independent Maturin packages built by the Python workspace.
exclude = ["libs/kinif", "libs/wizlaunch"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
deimos-core = { path = "crates/deimos-core" }
pyo3 = { version = "0.22", default-features = false }
getrandom = "0.2"
libc = "0.2"
memchr = "2.8"
chacha20poly1305 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = "0.58"
zeroize = "=1.8.1"
