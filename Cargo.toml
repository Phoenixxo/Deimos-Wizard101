[workspace]
members = [
    "crates/deimos-core",
    "crates/deimos-agent",
    "crates/deimos-native",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
deimos-core = { path = "crates/deimos-core" }
pyo3 = { version = "0.22", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = "0.58"
