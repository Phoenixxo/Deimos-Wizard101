name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev-main

env:
  DEIMOS_BUILD_ID: git-${{ github.sha }}

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install

    - name: Install Wine-compatible Rust
      uses: dtolnay/rust-toolchain@1.77.2
      with:
        targets: x86_64-pc-windows-msvc

    - name: Install dependencies
      run: uv sync --frozen --group dev

    - name: Prepare matching native package inputs
      shell: pwsh
      run: ./scripts/prepare-windows-package.ps1

    - name: Build with PyInstaller
      run: uv run --group dev pyinstaller --noconfirm --clean Deimos.spec

    - name: Verify packaged native artifacts
      run: >-
        uv run --group dev python scripts/package_artifacts.py verify-archive
        --archive dist/Deimos.exe

    - name: Verify build output
      shell: bash
      run: |
        if [ ! -f "dist/Deimos.exe" ]; then
          echo "Build failed: Deimos.exe not found"
          exit 1
        fi
        echo "Build OK: $(stat -c%s dist/Deimos.exe) bytes"
