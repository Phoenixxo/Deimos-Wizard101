name: Deimos Rust workspace

on:
  workflow_dispatch:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "libs/wizwalker/**"
      - "libs/wizlaunch/**"
      - "src/gui/**"
      - "Deimos.py"
      - "scripts/build-wine-agent.ps1"
      - "scripts/check-wine-agent-imports.ps1"
      - "scripts/test-deimos-native-live.py"
      - "scripts/test-deimos-launch-live.py"
      - "scripts/test-deimos-telemetry-live.py"
      - "scripts/test-deimos-window-input-live.py"
      - "tests/client_discovery/**"
      - "tests/memory_adapter/**"
      - "tests/hooks/**"
      - "tests/telemetry/**"
      - "tests/host_integration/**"
      - "tests/launch/**"
      - ".github/workflows/deimos-rust.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "libs/wizwalker/**"
      - "libs/wizlaunch/**"
      - "src/gui/**"
      - "Deimos.py"
      - "scripts/build-wine-agent.ps1"
      - "scripts/check-wine-agent-imports.ps1"
      - "scripts/test-deimos-native-live.py"
      - "scripts/test-deimos-launch-live.py"
      - "scripts/test-deimos-telemetry-live.py"
      - "scripts/test-deimos-window-input-live.py"
      - "tests/client_discovery/**"
      - "tests/memory_adapter/**"
      - "tests/hooks/**"
      - "tests/telemetry/**"
      - "tests/host_integration/**"
      - "tests/launch/**"
      - ".github/workflows/deimos-rust.yml"

env:
  # All CI host/agent artifacts from this workflow revision must share one ID.
  DEIMOS_BUILD_ID: git-${{ github.sha }}

jobs:
  portable:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check live Python acceptance script
        run: >-
          python -m py_compile
          scripts/test-deimos-native-live.py
          scripts/test-deimos-launch-live.py
          scripts/test-deimos-telemetry-live.py
          scripts/test-deimos-window-input-live.py

      - name: Run portable WizWalker tests
        run: |
          python -m unittest discover -s tests/client_discovery -p "test_*.py" -v
          python -m unittest discover -s tests/hooks -p "test_*.py" -v
          python -m unittest discover -s tests/telemetry -p "test_*.py" -v
          python -m unittest discover -s tests/host_integration -p "test_*.py" -v
          python -m unittest discover -s tests/launch -p "test_*.py" -v

      - name: Run portable tests
        env:
          PYO3_PYTHON: python
        run: cargo test --workspace

      - name: Run Clippy
        env:
          PYO3_PYTHON: python
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  native-builds:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            toolchain: "1.77.2"
          - os: macos-14
            target: aarch64-apple-darwin
            toolchain: stable

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Rust 1.78 raised the standard Windows target baseline to Windows 10 and
      # introduced imports that the Wizard101 CrossOver 23 runtime cannot load.
      - name: Install Wine-compatible Rust
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@1.77.2
        with:
          targets: ${{ matrix.target }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and smoke test independent wizlaunch package
        run: |
          python -m pip install --disable-pip-version-check "maturin>=1.0,<2.0"
          python -m pip install --disable-pip-version-check ./libs/wizlaunch
          python -c "import wizlaunch; assert wizlaunch.__version__ == '0.2.0'; assert callable(wizlaunch.launch_instance)"

      - name: Install WizWalker adapter test dependencies
        run: python -m pip install --disable-pip-version-check -e ./libs/wizwalker

      - name: Build workspace
        env:
          PYO3_PYTHON: python
        run: rustup run ${{ matrix.toolchain }} cargo build --locked --workspace --release --target ${{ matrix.target }} --features deimos-native/extension-module

      - name: Smoke test Windows Python extension import
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $suffix = (& python -c "import sysconfig; print(sysconfig.get_config_var('EXT_SUFFIX'))").Trim()
          $source = "./target/${{ matrix.target }}/release/deimos_native.dll"
          $destination = Join-Path $env:RUNNER_TEMP "deimos_native$suffix"
          Copy-Item -LiteralPath $source -Destination $destination
          $env:PYTHONPATH = $env:RUNNER_TEMP
          python -c "import deimos_native; assert hasattr(deimos_native, 'AgentManager'); manager = deimos_native.HostHotkeyManager(); registration = manager.register_hotkey(0x87, 0x4000); manager.unregister_hotkey(registration)"
          "PYTHONPATH=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke test macOS Python extension import
        if: runner.os == 'macOS'
        shell: bash
        run: |
          suffix="$(python -c "import sysconfig; print(sysconfig.get_config_var('EXT_SUFFIX'))")"
          cp "./target/${{ matrix.target }}/release/libdeimos_native.dylib" "$RUNNER_TEMP/deimos_native$suffix"
          PYTHONPATH="$RUNNER_TEMP" python -c "import deimos_native; assert hasattr(deimos_native, 'AgentManager'); assert hasattr(deimos_native, 'HostHotkeyManager')"
          echo "PYTHONPATH=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Upload Wine agent
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: deimos-agent-${{ github.sha }}
          path: ./target/${{ matrix.target }}/release/deimos-agent.exe
          if-no-files-found: error

      - name: Upload macOS native extension
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: deimos-native-macos-${{ github.sha }}
          path: ${{ runner.temp }}/deimos_native*.so
          if-no-files-found: error

      - name: Run WizWalker compatibility tests
        env:
          DEIMOS_TEST_REAL_NATIVE: "1"
        run: |
          python -m unittest discover -s tests/client_discovery -p "test_*.py" -v
          python -m unittest discover -s tests/memory_adapter -p "test_*.py" -v
          python -m unittest discover -s tests/hooks -p "test_*.py" -v
          python -m unittest discover -s tests/telemetry -p "test_*.py" -v
          python -m unittest discover -s tests/host_integration -p "test_*.py" -v
          python -m unittest discover -s tests/launch -p "test_*.py" -v

      - name: Reject unsupported Wine agent imports
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/check-wine-agent-imports.ps1
          -AgentPath ./target/${{ matrix.target }}/release/deimos-agent.exe

      - name: Run deterministic memory fixture integration test
        if: runner.os == 'Windows'
        run: rustup run ${{ matrix.toolchain }} cargo test --locked --package deimos-memory-fixture --test windows_lifecycle --target ${{ matrix.target }}
