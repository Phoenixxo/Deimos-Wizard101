name: Deimos Rust workspace

on:
  workflow_dispatch:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/build-wine-agent.ps1"
      - "scripts/check-wine-agent-imports.ps1"
      - "scripts/test-deimos-native-live.py"
      - ".github/workflows/deimos-rust.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/build-wine-agent.ps1"
      - "scripts/check-wine-agent-imports.ps1"
      - "scripts/test-deimos-native-live.py"
      - ".github/workflows/deimos-rust.yml"

env:
  # All CI host/agent artifacts from this workflow revision must share one ID.
  # DMS-023 release packaging may replace this with its artifact identity.
  DEIMOS_BUILD_ID: git-${{ github.sha }}

jobs:
  portable:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check live Python acceptance script
        run: python -m py_compile scripts/test-deimos-native-live.py

      - name: Run portable tests
        env:
          PYO3_PYTHON: python
        run: cargo test --workspace

      - name: Run Clippy
        env:
          PYO3_PYTHON: python
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  native-builds:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            toolchain: "1.77.2"
          - os: macos-14
            target: aarch64-apple-darwin
            toolchain: stable

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Rust 1.78 raised the standard Windows target baseline to Windows 10 and
      # introduced imports that the Wizard101 CrossOver 23 runtime cannot load.
      - name: Install Wine-compatible Rust
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@1.77.2
        with:
          targets: ${{ matrix.target }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build workspace
        env:
          PYO3_PYTHON: python
        run: rustup run ${{ matrix.toolchain }} cargo build --locked --workspace --release --target ${{ matrix.target }} --features deimos-native/extension-module

      - name: Smoke test Windows Python extension import
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $suffix = (& python -c "import sysconfig; print(sysconfig.get_config_var('EXT_SUFFIX'))").Trim()
          $source = "./target/${{ matrix.target }}/release/deimos_native.dll"
          $destination = Join-Path $env:RUNNER_TEMP "deimos_native$suffix"
          Copy-Item -LiteralPath $source -Destination $destination
          $env:PYTHONPATH = $env:RUNNER_TEMP
          python -c "import deimos_native; assert hasattr(deimos_native, 'AgentManager')"

      - name: Smoke test macOS Python extension import
        if: runner.os == 'macOS'
        shell: bash
        run: |
          suffix="$(python -c "import sysconfig; print(sysconfig.get_config_var('EXT_SUFFIX'))")"
          cp "./target/${{ matrix.target }}/release/libdeimos_native.dylib" "$RUNNER_TEMP/deimos_native$suffix"
          PYTHONPATH="$RUNNER_TEMP" python -c "import deimos_native; assert hasattr(deimos_native, 'AgentManager')"

      - name: Reject unsupported Wine agent imports
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/check-wine-agent-imports.ps1
          -AgentPath ./target/${{ matrix.target }}/release/deimos-agent.exe

      - name: Run deterministic memory fixture integration test
        if: runner.os == 'Windows'
        run: rustup run ${{ matrix.toolchain }} cargo test --locked --package deimos-memory-fixture --test windows_lifecycle --target ${{ matrix.target }}
